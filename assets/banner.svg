<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="title-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
      fill: #F9FAFB;
    }
    .gradient-span {
      fill: url(#neon-blue);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38BDF8;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #9CA3AF;
    }
    .badge-text {
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #E0E7FF;
    }
    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38BDF8;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #9CA3AF;
    }
  </style>

  <!-- Background Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-grad)"/>
  <rect width="1000" height="240" rx="16" stroke="url(#neon-blue)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Radial Glow behind text -->
  <circle cx="280" cy="110" r="140" fill="url(#glow-grad)"/>

  <!-- Geometric Grid Pattern Lines -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="250" y1="0" x2="250" y2="240"/>
    <line x1="350" y1="0" x2="350" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="550" y1="0" x2="550" y2="240"/>
    <line x1="650" y1="0" x2="650" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
    <line x1="850" y1="0" x2="850" y2="240"/>
    <line x1="950" y1="0" x2="950" y2="240"/>
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
  </g>

  <!-- Wave Bottom Layers -->
  <path d="M0,170 C200,140 380,210 600,165 C780,130 900,185 1000,160 L1000,240 L0,240 Z" fill="url(#wave-grad-1)"/>
  <path d="M0,195 C220,165 400,230 650,185 C820,150 920,205 1000,185 L1000,240 L0,240 Z" fill="url(#wave-grad-2)"/>
  <path d="M0,215 C260,190 440,240 700,205 C850,180 940,225 1000,210 L1000,240 L0,240 Z" fill="#0B0F19" fill-opacity="0.8"/>

  <!-- Left Content -->
  <!-- Subtitle Tag -->
  <text x="60" y="55" class="subtitle">COMPUTER ENGINEER • LEAD DEVELOPER</text>

  <!-- Title -->
  <text x="60" y="98" class="title">Adrian Dario Vargas Montoya</text>

  <!-- Bio Summary -->
  <text x="60" y="132" class="desc">Lead Developer &amp; CI/CD Owner @ P&amp;G • Cloud Infrastructure • Data Pipelines • Scalable Microservices</text>

  <!-- Highlights Badges / Pills -->
  <!-- Pill 1: $144K/yr Saved -->
  <g transform="translate(60, 155)">
    <rect width="165" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#10B981"/>
    <text x="28" y="18" class="badge-text">60% Cloud Cost Savings</text>
  </g>

  <!-- Pill 2: 95% Faster CI/CD -->
  <g transform="translate(235, 155)">
    <rect width="155" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#6366F1"/>
    <text x="28" y="18" class="badge-text">95% Faster CI/CD Pipelines</text>
  </g>

  <!-- Pill 3: 99.7% Latency Reduction -->
  <g transform="translate(400, 155)">
    <rect width="185" height="28" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#A855F7"/>
    <text x="28" y="18" class="badge-text">99.7% Payload &amp; Latency Cut</text>
  </g>

  <!-- Pill 4: TEC Graduate -->
  <g transform="translate(595, 155)">
    <rect width="150" height="28" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#F59E0B"/>
    <text x="28" y="18" class="badge-text">B.S. CompEng @ TEC</text>
  </g>

  <!-- Right Decorative Tech Orb / Visual Accent -->
  <g transform="translate(860, 95)">
    <circle cx="30" cy="20" r="55" fill="url(#neon-blue)" opacity="0.12" filter="url(#glow)"/>
    <circle cx="30" cy="20" r="42" stroke="url(#neon-blue)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="30" cy="20" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Terminal / Code Icon -->
    <path d="M22,14 L28,20 L22,26 M31,25 L38,25" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
