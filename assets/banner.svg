<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
      fill: #F9FAFB;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38BDF8;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #9CA3AF;
    }
    .badge-text {
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #E0E7FF;
    }
  </style>

  <!-- Background Card -->
  <rect width="1000" height="220" rx="16" fill="url(#bg-grad)"/>
  <rect width="1000" height="220" rx="16" stroke="url(#neon-blue)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Radial Glow behind text -->
  <circle cx="280" cy="100" r="130" fill="url(#glow-grad)"/>

  <!-- Geometric Grid Pattern Lines -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="220"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="250" y1="0" x2="250" y2="220"/>
    <line x1="350" y1="0" x2="350" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="550" y1="0" x2="550" y2="220"/>
    <line x1="650" y1="0" x2="650" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
    <line x1="850" y1="0" x2="850" y2="220"/>
    <line x1="950" y1="0" x2="950" y2="220"/>
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="110" x2="1000" y2="110"/>
    <line x1="0" y1="165" x2="1000" y2="165"/>
  </g>

  <!-- Wave Bottom Layers -->
  <path d="M0,155 C200,130 380,195 600,150 C780,120 900,170 1000,145 L1000,220 L0,220 Z" fill="url(#wave-grad-1)"/>
  <path d="M0,175 C220,150 400,210 650,170 C820,135 920,185 1000,170 L1000,220 L0,220 Z" fill="url(#wave-grad-2)"/>
  <path d="M0,195 C260,170 440,220 700,190 C850,165 940,205 1000,190 L1000,220 L0,220 Z" fill="#0B0F19" fill-opacity="0.8"/>

  <!-- Left Content -->
  <text x="60" y="52" class="subtitle">COMPUTER ENGINEER • SOFTWARE DEVELOPER</text>
  <text x="60" y="92" class="title">Adrian Dario Vargas Montoya</text>
  <text x="60" y="124" class="desc">Cloud Infrastructure • Scalable Microservices • Data Pipelines • CI/CD Automation</text>

  <!-- Highlights Pills -->
  <g transform="translate(60, 145)">
    <rect width="135" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#38BDF8"/>
    <text x="28" y="18" class="badge-text">Cloud &amp; DevOps</text>
  </g>

  <g transform="translate(205, 145)">
    <rect width="135" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#6366F1"/>
    <text x="28" y="18" class="badge-text">Data Pipelines</text>
  </g>

  <g transform="translate(350, 145)">
    <rect width="165" height="28" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#A855F7"/>
    <text x="28" y="18" class="badge-text">Backend Microservices</text>
  </g>

  <g transform="translate(525, 145)">
    <rect width="150" height="28" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="5" fill="#10B981"/>
    <text x="28" y="18" class="badge-text">CI/CD Automation</text>
  </g>

  <!-- Right Decorative Tech Orb -->
  <g transform="translate(860, 85)">
    <circle cx="30" cy="20" r="50" fill="url(#neon-blue)" opacity="0.12" filter="url(#glow)"/>
    <circle cx="30" cy="20" r="38" stroke="url(#neon-blue)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="30" cy="20" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M22,14 L28,20 L22,26 M31,25 L38,25" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
